name: Tests

# Runs the backend test suite (backend/tests/, stdlib unittest, pytest-
# discoverable) on every push and pull request. Needs a real Tesseract
# OCR binary installed at the OS level -- test_ocr_extraction.py has no
# mocked fallback for "Tesseract isn't installed" (see its module
# docstring), so without this step those 3 tests would fail here the
# same way they'd fail on a local machine without Tesseract.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tesseract OCR (system dependency, not pip-installable)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr fonts-dejavu-core

      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt

      - name: DEBUG OCR output
        run: python3 tests/_debug_ocr.py
        working-directory: backend

      - name: Run test suite
        run: python3 -m unittest discover -s tests -v
        working-directory: backend
